<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Icosaedro animado</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(ellipse at 50% 50%, #0a0d14 0%, #000000 75%);
    overflow: hidden;
  }
  svg {
    width: 100vw;
    height: 100vh;
    display: block;
  }
  .wob {
    transform-box: fill-box;
    transform-origin: center;
    animation: wob 9s ease-in-out infinite;
  }
  .spin {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin 18s linear infinite;
  }
  .edge {
    fill: none;
    stroke: #eaf2ff;
    stroke-width: 2.4;
    stroke-linecap: round;
    filter: drop-shadow(0 0 4px rgba(170, 210, 255, 0.85));
    stroke-dasharray: var(--len);
    stroke-dashoffset: var(--len);
    animation: draw 6s ease-in-out infinite;
    animation-delay: var(--d);
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  @keyframes wob {
    0%, 100% { transform: scale(1, 1); }
    50%      { transform: scale(0.92, 1.04); }
  }
  @keyframes draw {
    0%   { stroke-dashoffset: var(--len); }
    45%  { stroke-dashoffset: 0; }
    50%  { stroke-dashoffset: 0; }
    95%  { stroke-dashoffset: var(--len); }
    100% { stroke-dashoffset: var(--len); }
  }
</style>
</head>
