<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASCII Art Effect</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; }
  </style>
</head>
<body>
<div id="text-mask-hero" style="position:relative;width:100%;height:100vh;overflow:hidden;background:#111;">
  <canvas id="tmh-canvas" style="display:block;width:100%;height:100%;"></canvas>
</div>

<script>
(() => {
  const container = document.getElementById("text-mask-hero");
  const canvas = document.getElementById("tmh-canvas");
  const ctx = canvas.getContext("2d", { alpha: false });

  const BACKGROUND = "#131313";
  const TEXT_COLOR = "rgba(230,230,230,0.9)";
  const TEXT_FADE = "rgba(255,255,255,0.12)";
  const FONT_FAMILY = "ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace";
  const FONT_SIZE = 13;
  const LINE_HEIGHT = 14;
  const CHAR_WIDTH = 8;
  const MOUSE_RADIUS = 110;
  const CLICK_FORCE = 22;
  const HOVER_FORCE = 8;
  const DAMPING = 0.88;
  const SPRING = 0.08;
  const REWRITE_SPEED = 0.06;

  const sourceText = `
SCHEMA AS A SYSTEM · THE HARD FIELDS ALREADY BUILT · AGENT NATIVE NO DRIFT ·
FETCH LAYER SOLVED · STUDIO EDITORS USE · WEBHOOKS INVALIDATE ON PUBLISH ·
EVERY DECISION ALREADY MADE · PAGE BUILDER WITH GUARDRAILS · JUST CLONED ·
A LINK FIELD THAT HANDLES EVERYTHING · MEDIA FIELD ONE SHAPE · CDN BYPASSED ·
DRAFT MODE WIRED · A SYSTEM NOT A STARTER · PRODUCTION FOUNDATION ·
COMMIT ONCE REUSE EVERYWHERE · TYPED COMPOSED SWAPPABLE ·
`;

  const glyphs = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#.:/\\-_+=*";
  const particles = [];
  let cols = 0, rows = 0, dpr = Math.max(1, window.devicePixelRatio || 1);
  let mouse = { x: -9999, y: -9999, down: false };
  let maskData = null;
  let maskCanvas = document.createElement("canvas");
  let maskCtx = maskCanvas.getContext("2d");

  class CharParticle {
    constructor(x, y, char) {
      this.homeX = x;
      this.homeY = y;
      this.x = x + (Math.random() - 0.5) * 20;
      this.y = y + (Math.random() - 0.5) * 20;
      this.vx = 0;
      this.vy = 0;
      this.char = char;
      this.alpha = 0.35 + Math.random() * 0.65;
    }

    update() {
      const dxh = this.homeX - this.x;
      const dyh = this.homeY - this.y;
      this.vx += dxh * SPRING;
      this.vy += dyh * SPRING;

      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist2 = dx * dx + dy * dy;
      const r2 = MOUSE_RADIUS * MOUSE_RADIUS;

      if (dist2 < r2) {
        const dist = Math.sqrt(dist2) || 0.001;
        const force = (1 - dist / MOUSE_RADIUS) * (mouse.down ? CLICK_FORCE : HOVER_FORCE);
        this.vx += (dx / dist) * force;
        this.vy += (dy / dist) * force;
      }

      this.vx *= DAMPING;
      this.vy *= DAMPING;
      this.x += this.vx;
      this.y += this.vy;

      if (Math.random() < REWRITE_SPEED) {
        if (Math.random() < 0.65) {
          this.char = sourceText[(Math.random() * sourceText.length) | 0];
        } else {
          this.char = glyphs[(Math.random() * glyphs.length) | 0];
        }
      }
    }

    draw() {
      ctx.globalAlpha = this.alpha;
      ctx.fillText(this.char, this.x, this.y);
    }
  }

  function resize() {
    const rect = container.getBoundingClientRect();
    dpr = Math.max(1, window.devicePixelRatio || 1);
    canvas.width = Math.floor(rect.width * dpr);
    canvas.height = Math.floor(rect.height * dpr);
    canvas.style.width = rect.width + "px";
    canvas.style.height = rect.height + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = `${FONT_SIZE}px ${FONT_FAMILY}`;
    ctx.textBaseline = "top";
    cols = Math.floor(rect.width / CHAR_WIDTH);
    rows = Math.floor(rect.height / LINE_HEIGHT);

    buildMaskAndParticles(rect.width, rect.height);
  }

  // Human silhouette mask — public domain SVG (OpenClipart #41519, CC0)
  const SILHOUETTE_PATH = `m 421.58639,1269.8616 c 38.82691,-10.528 57.36007,-8.6677 73.03686,-6.8739 15.6768,1.7938 15.84298,-5.3471 26.83636,13.4853 10.99337,18.8322 3.68516,87.2521 3.68516,87.2521 0,0 -17.40411,11.0265 -47.5622,17.4695 -30.15807,6.4429 -68.98496,16.9709 -96.18695,19.1958 -27.20199,2.2248 -79.97835,-1.8614 -94.06076,-10.7629 -14.08241,-8.9015 -25.30847,-17.7364 -27.86568,-30.6566 -2.55721,-12.9201 3.25524,-17.0718 24.81097,-22.2859 21.55572,-5.2143 31.78569,-14.9789 54.80284,-21.5879 23.01714,-6.6091 53.37466,-21.6211 62.17643,-31.419 8.80179,-9.7979 20.32697,-13.8165 20.32697,-13.8165 z m 335.62238,896.37156 c -2.321,-11.28123 -2.69052,-34.18 15.15105,-44.18234 17.84154,-10.00234 29.12276,-12.32333 56.18191,-14.45331 27.05917,-2.12995 35.49206,-4.22676 48.11853,10.54224 12.62646,14.769 15.05957,27.47439 19.36524,45.76434 4.30569,18.28996 5.95406,21.02619 15.95641,38.86772 10.00234,17.84154 13.52329,26.16232 19.25313,44.34015 5.72985,18.1779 19.81366,51.46104 21.38312,71.39934 1.56949,19.9384 -14.47842,52.7274 -15.6452,74.3141 -1.16679,21.5867 2.12995,27.0591 -0.79729,44.4854 -2.92726,17.4263 -6.94237,39.2373 -5.59712,56.3273 1.34525,17.0899 2.12994,27.0591 3.25098,41.3007 1.12104,14.2418 14.80219,5.9999 2.46629,31.3317 -12.3359,25.3318 -43.97068,42.1519 -61.62118,36.3764 -17.65052,-5.7756 -49.12746,-23.3598 -50.2485,-37.6015 -1.12104,-14.2417 10.79962,-26.6439 14.92684,-47.0307 4.12722,-20.3867 12.78431,-19.6352 10.43014,-49.5426 -2.35418,-29.9075 -0.29057,-40.1008 -8.11721,-66.7116 -7.82662,-26.6107 -17.30163,-55.9577 -23.25569,-76.9839 -5.95405,-21.0262 -5.20251,-29.6833 -9.50818,-47.9732 -4.30569,-18.29004 -13.14125,-57.71827 -51.69328,-110.57024 z m 328.19079,455.53166 c 41.32995,-47.0345 75.39335,-43.13633 103.7795,-39.88785 114.95729,16.81043 95.49697,79.00384 95.19833,123.0502 -2.52134,47.16204 -41.97962,52.71173 -56.50516,104.25159 -6.08845,33.77101 -5.52239,48.25647 -6.37702,68.2892 -0.85463,20.03273 1.12935,40.3903 -1.46942,63.09924 -2. 3.64471,-36.36549 21.2132,-32.32488 37.37564,-75.76144 26.26396,-109.09648 -11.11167,-33.33503 -51.51778,-103.03556 -55.55839,-120.20815 -4.04061,-17.17259 3.03046,-88.89342 23.23351,-140.4112 20.20305,-51.51778 19.1929,-44.44672 32.32488,-136.370597 13.13199,-91.923882 -30.30457,-142.431509 -30.30457,-142.431509 0,0 -37.37565,-42.426404 -35.35534,-72.730984 2.0203,-30.30458 -121.85138,40.02902 -121.85138,40.02902 0,0 -92.93228,50.460893 -101.39233,153.747985 -18.15452,117.653105 20.14361,123.437055 19.1929,278.974385 2.0203,41.41626 19.85554,105.49346 14.47345,122.95233 z m 715.38316,-221.3823 c 26.8768,-58.39833 5.95554,-123.98364 -42.77166,-157.55126 -48.72719,-33.56763 -126.6907,17.32522 -133.18766,21.65653 -53.62747,54.9 -23.63894,96.44092 -34.65045,112.61395 -8.66261,12.99392 -23.05133,26.25009 -21.6289,36.91333 0.89172,6.6848 12.95454,11.81654 21.37696,10.2852 -11.62795,18.87813 -8.67172,43.85564 6.67807,70.46358 82.73078,-2.73391 175.46002,-32.51001 204.18364,-94.38133 z m 625.35905,-185.46992 c 0,0 1.35352,-0.49427 -4.87273,29.01276 -14.07675,6.22626 -47.10295,14.61816 -47.10295,14.61816 m 609.42298,-248.39492 c 0,-9.57093 2.67986,-24.88441 13.01646,-26.03292 10.3366,-1.14851 17.22767,2.67986 19.52469,9.18809 4.94795,14.01915 5.35972,34.45533 -2.67986,42.49491 -8.03958,8.03958 -12.25078,13.78213 -15.31347,19.52468 -3.06271,5.74256 -4.9769,9.1881 -9.95377,9.18809 -9.01092,-1e-5 -10.71944,-5.35972 -11.10227,-9.57092 -0.38285,-4.21121 -0.38285,-4.59404 -0.38285,-4.59404 m 381.42857,1292.3622 c 38.57143,-11.4286 57.14286,-10 72.85714,-8.5714 15.71429,1.4285 15.71429,-5.7143 27.14286,12.8571 11.42857,18.5714 5.71428,87.1429 5.71428,87.1429 0,0 -17.14285,11.4285 -47.14285,18.5714 -30,7.1428 -68.57143,18.5714 -95.71429,21.4286 -27.14286,2.8571 -80,0 -94.28571,-8.5715 -14.28572,-8.5714 -25.71429,-17.1428 -28.57143,-30 -2.85714,-12.8571 2.85714,-17.1428 24.28571,-22.8571 21.42857,-5.7143 31.42857,-15.7143 54.28572,-22.8572 22.85714,-7.1428 52.85714,-22.8571 61.42857   const SILHOUETTE_BBOX = { minX: 218.57143, minY: -412.50119, maxX: 774.65497, maxY: 1426.6479 };

  function drawMask(w, h) {
    maskCtx.clearRect(0, 0, w, h);
    maskCtx.fillStyle = "#fff";
    const bw = SILHOUETTE_BBOX.maxX - SILHOUETTE_BBOX.minX;
    const bh = SILHOUETTE_BBOX.maxY - SILHOUETTE_BBOX.minY;
    const scale = Math.min(w / bw, h / bh) * 0.94;
    maskCtx.save();
    maskCtx.translate(
      w / 2 - (SILHOUETTE_BBOX.minX + bw / 2) * scale,
      h / 2 - (SILHOUETTE_BBOX.minY + bh / 2) * scale
    );
    maskCtx.scale(scale, scale);
    maskCtx.fill(new Path2D(SILHOUETTE_PATH));
    maskCtx.restore();
  }

  function buildMaskAndParticles(w, h) {
    particles.length = 0;

    maskCanvas.width = w;
    maskCanvas.height = h;

    drawMask(w, h);

    maskData = maskCtx.getImageData(0, 0, w, h).data;

    let i = 0;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const x = c * CHAR_WIDTH + 2;
        const y = r * LINE_HEIGHT + 2;
        const px = Math.min(w - 1, Math.max(0, x | 0));
        const py = Math.min(h - 1, Math.max(0, y | 0));
        const idx = (py * w + px) * 4;
        const a = maskData[idx + 3];
        const lum = (maskData[idx] + maskData[idx + 1] + maskData[idx + 2]) / 3;

        if (a > 20 && lum > 40) {
          const ch = sourceText[i++ % sourceText.length];
          particles.push(new CharParticle(x, y, ch));
        }
      }
    }
  }

  function renderBackgroundText(w, h) {
    ctx.fillStyle = TEXT_FADE;
    ctx.font = `${FONT_SIZE - 1}px ${FONT_FAMILY}`;
    const line = "EVERY DECISION ALREADY MADE · SCHEMA AS A SYSTEM · ";
    for (let y = 0; y < h; y += LINE_HEIGHT) {
      let x = -((y / LINE_HEIGHT * 17) % 120);
      while (x < w + 200) {
        ctx.fillText(line, x, y);
        x += 320;
      }
    }
    ctx.font = `${FONT_SIZE}px ${FONT_FAMILY}`;
  }

  function animate() {
    const w = canvas.width / dpr;
    const h = canvas.height / dpr;

    ctx.fillStyle = BACKGROUND;
    ctx.fillRect(0, 0, w, h);

    renderBackgroundText(w, h);

    ctx.fillStyle = TEXT_COLOR;
    for (let p of particles) {
      p.update();
      p.draw();
    }

    requestAnimationFrame(animate);
  }

  container.addEventListener("mousemove", (e) => {
    const r = container.getBoundingClientRect();
    mouse.x = e.clientX - r.left;
    mouse.y = e.clientY - r.top;
  });

  container.addEventListener("mouseleave", () => {
    mouse.x = -9999;
    mouse.y = -9999;
    mouse.down = false;
  });

  container.addEventListener("mousedown", () => {
    mouse.down = true;
  });

  window.addEventListener("mouseup", () => {
    mouse.down = false;
  });

  container.addEventListener("click", (e) => {
    const r = container.getBoundingClientRect();
    const cx = e.clientX - r.left;
    const cy = e.clientY - r.top;

    for (let p of particles) {
      const dx = p.x - cx;
      const dy = p.y - cy;
      const d = Math.sqrt(dx * dx + dy * dy) || 0.001;
      if (d < MOUSE_RADIUS * 1.4) {
        const f = (1 - d / (MOUSE_RADIUS * 1.4)) * 35;
        p.vx += (dx / d) * f;
        p.vy += (dy / d) * f;
      }
    }
  });

  window.addEventListener("resize", resize);

  resize();
  animate();
})();
</script>
